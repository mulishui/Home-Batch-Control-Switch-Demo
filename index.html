<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent 会让状态栏盖在页面内容上，系统对状态栏下面的内容做一层原生毛玻璃模糊
     （头像紧贴顶部时最明显）；改成 default 后状态栏变成不透明实色条，不再盖内容，也就没有
     这层模糊了，代价是状态栏区域不再和下面的浅蓝渐变无缝衔接，详见 .phone 里 --safe-top 的注释 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Batch Control 切换 Demo · 框架草稿</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    background:#f5f7fa;color:#1D2529;overflow:hidden;
  }
  /* 非移动端：整屏居中，内容不够放就靠 JS 整体缩放塞进一屏 */
  .stage{display:flex;justify-content:center;align-items:center;height:100vh;padding:16px;overflow:hidden}
  .stage-fit{display:flex;gap:24px;align-items:flex-start;flex-wrap:nowrap;transform-origin:center center}

  .phone-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto}

  /* 手机尺寸桌面预览下不再写死某个具体机型的像素值，由 JS 按当前浏览器窗口大小算出来
     （保持手机的宽高比），见下方 sizePhone()；宽高和 --screen-h 都是 JS 写进来的 inline 值，
     这里不设默认值，移动端走下方 media query 的 100dvh */
  .phone{
    border-radius:55px;background:#f5f7fa;
    box-shadow:0 18px 44px rgba(20,22,30,.16),0 0 0 9px #1c1d21,0 0 0 10px #35373f;
    overflow:hidden;position:relative;
    /* 给 position:fixed 的子元素（header-fade-bg）建立一个定位基准：不加这个，fixed 元素会
       以外层桌面预览缩放容器 #stageFit（甚至是真实视口）为基准，宽度/位置就对不上手机屏幕了 */
    transform:translateZ(0);
    user-select:none;-webkit-user-select:none;
    /* 顶部安全区：这个 59px floor 是桌面预览模式下模拟手机状态栏高度用的（桌面浏览器里
       env() 恒为 0），真机移动端会被下方 @media 里更小的 --safe-top 覆盖掉，见那边注释 */
    --safe-top:max(59px, env(safe-area-inset-top, 0px));
    --topbar-h:calc(var(--safe-top) + 64px);
    --page-margin:16px;
    --tabrow-h:68px; /* .tab-pill 高度 48px + .tab-row 上下 padding 各 10px */
    --shortcutrow-h:72px; /* .shortcut-row img 高度 64px + 上 6px/下 2px padding */
  }
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#f5f7fa}
  .screen::-webkit-scrollbar{display:none}

  /* 头像 + 顶部菜单：固定顶部，背景透明，露出下面 .screen 的纯色底色 */
  .top-bar{
    position:absolute;top:0;left:0;right:0;z-index:10;height:var(--topbar-h);
    padding:0 16px;padding-top:var(--safe-top);
    display:flex;align-items:center;justify-content:space-between;
  }
  /* 白色描边要求是"outside"（往外扩，不吃头像本身的圆形区域）：border 会占用盒子自身空间、
     又会被 border-radius 裁切得不均匀，outline 则不跟随圆角走样——用 box-shadow 的
     0 模糊 + 2px 扩散来模拟 Figma 的 outside stroke，天然贴合圆角且不影响头像本身的布局尺寸 */
  .avatar{
    width:40px;height:40px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #fff;
    background:#d9d9e0 url(assets/Profile_Picture.png) center/cover no-repeat;
  }
  .top-actions{display:flex;gap:8px}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:none;
    background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#1D2529;
  }
  .icon-btn svg{width:24px;height:24px;display:block}

  .scroll-content{position:relative;z-index:1;padding-top:var(--topbar-h)}

  /* header-bg 是常显的底图（z-index:2），不像 header-fade-bg 那样跟滚动淡入淡出——
     所以 page-title/banner 必须给一个比它更高的 z-index（3），不然按 CSS 规则，
     定位元素（header-bg）天生会盖在非定位的静态内容（page-title/banner）上面，
     常显的底图会把文字永久挡住。
     同样的道理也适用于下面的 .pager（设备列表）：只要列表本身不定位，不管 DOM
     顺序，往下滑到设备卡片的屏幕位置穿过 header-bg 常驻的那段高度时，卡片就会被
     这层底图盖住，所以 .pager 也必须给 position:relative + 比 header-bg（2）更高
     的 z-index（见下方 .pager）。
     但 .pager 不能给得比 header-fade-bg（4）还高（之前给到 5 时踩过这个坑）：
     header-fade-bg 跟随滚动淡入到 100%、盖住吸顶的 tab-row 缝隙后面那段高度，就是
     为了在这段高度里把滚上来的列表内容遮住——如果 .pager 比它高，列表反而会画在
     渐变层上面，从 tab-pill 之间的透明缝隙里透出来，渐变等于白做了。所以 .pager 的
     z-index 必须卡在 header-bg（2）和 header-fade-bg（4）之间，这里用 3，和
     page-title/banner 同级即可——它们在滚动时机上互不重叠，不会因为同值打架。 */
  .page-title{position:relative;z-index:3;padding:4px var(--page-margin) 14px;font-size:28px;font-weight:700;color:#1D2529;display:flex;align-items:center;gap:4px}
  .page-title svg{width:24px;height:24px}
  .banner{
    position:relative;z-index:3;
    margin:0 var(--page-margin) 16px;padding:11px 14px;border-radius:14px;font-size:13px;color:#3a3d44;
    background:rgba(255,255,255,.55);display:flex;align-items:center;gap:8px;
  }

  /* 头部背景图（assets/header-bg@2x.png）：最底层、常显的背景，和 header-fade-bg
     （跟随滚动淡入淡出的渐变叠加层）是两个独立的东西——它不跟随滚动进度变化，
     一直是完全可见的，所以这里不写 opacity，也不在 JS 里改它的 opacity。
     position:fixed 定位基准同样是 .phone（见上面 .phone 的 transform），不随
     列表滚动产生位移。宽度 100% 自动填满，高度写死成素材本身的设计高度（图片
     @2x 导出，728px / 2 = 364px），这是真实资源的固有尺寸，不是靠猜的占位数字。
     z-index 给全场最低的 2，保证它在 page-title/banner（3）和 header-fade-bg（4）
     之下，是名副其实的最底层。
     （之前一度怀疑这张图自带的虚焦质感是"顶部模糊"的来源换成纯色渐变试过，但真机上
     状态栏那圈模糊其实是 iOS 系统自带的状态栏/标题栏毛玻璃效果，不是这张图或本页面
     CSS 画出来的，页面代码改不动，所以换回原图。） */
  .header-bg{
    position:fixed;top:0;left:0;right:0;z-index:2;height:364px;
    background:url(assets/header-bg@2x.png) top/100% auto no-repeat;
    pointer-events:none;
  }

  /* 顶部栏+BC tab 共用的渐变背景：宽度填满，高度 = 头像栏+BC 的实际渲染高度（JS 量出来
     再写进 style.height，不写死数字，换真实图标/文案导致这两者变高变矮时能跟着对），
     位置常驻屏幕顶部，不随列表滚动产生任何位移——必须用 position:fixed（相对 .phone
     定位，见上面 .phone 的 transform）而不是 sticky：sticky 在没滚到阈值之前还是按
     文档流原位置走，会跟着内容一起往上移，做不到"从一开始就贴死在顶部"。
     渐变本身有两层独立的透明度叠加：
     1) 色块从上到下自带颜色渐变：AECDED → C2D9F0（0%~86%，两个色值很接近，看起来偏实色是正常的）。
     2) 最后 14% 的高度要整体淡出到全透明——这里不能只改 background 颜色的 alpha：
        backdrop-filter 的模糊是独立叠加在颜色上面的一层效果，只让颜色透明度归零，
        模糊本身还是会直接截断在盒子边缘，看起来就是一条硬边（之前的 bug）。
        改用 mask-image 对整个元素（颜色+模糊）一起做透明度淡出，这样模糊和颜色才会
        一起慢慢消失，而不是颜色淡出了、模糊还留着一条硬边。
     3) 整个图层作为一个整体的 opacity，由 JS 跟着 .screen 的 scrollTop 算：刚打开页面
        （scrollTop=0）时整层是 0%，滚到 BC 吸顶的那一刻整层淡到 100%，之后保持 100%
        不再变化——用 updateFadeOpacity() 实现，见下方脚本。
     必须塞在 .scroll-content 内部（而不是和 .screen 平级）：.tab-row 的 z-index 只在
     .scroll-content 自己的层叠上下文里起作用，放外面哪怕 z-index 再高也会整块盖住 tab-row。 */
  .header-fade-bg{
    position:fixed;top:0;left:0;right:0;z-index:4;opacity:0;
    background:linear-gradient(to bottom, #AECDED 0%, #C2D9F0 86%, #C2D9F0 100%);
    -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 86%, transparent 100%);
    mask-image:linear-gradient(to bottom, #000 0%, #000 86%, transparent 100%);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    pointer-events:none;
  }

  /* Batch Control tab 行：占位版——先用文字胶囊，左右可滑动，真素材到了再替换；
     自己不再带白底模糊，吸顶后露出来的是 header-fade-bg 淡到 100% 的那层渐变 */
  .tab-row{
    position:sticky;top:var(--topbar-h);z-index:6;
    display:flex;gap:10px;padding:10px var(--page-margin);overflow-x:auto;
  }
  .tab-row::-webkit-scrollbar{display:none}
  .tab-pill{
    flex:0 0 auto;border:none;cursor:pointer;box-sizing:border-box;
    height:48px;min-width:56px;padding:0 16px;border-radius:24px;background:#fff;color:var(--accent,#1D2529);
    font-size:14px;font-weight:400;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;gap:0;
    transform:scale(1);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background-color .2s ease,color .2s ease,gap .2s ease;
  }
  .tab-pill svg{width:24px;height:24px;flex:0 0 auto;display:block}
  /* 文字不用 display:none/inline-block 切换——display 没法被 transition 插值，会瞬间蹦出来，
     把缩放/变色这些本该平滑的动画盖过去，看起来像"一帧闪现"。改用 max-width+opacity 过渡展开，
     max-width 给够一个比最长 label（Environment/All Devices）更宽的值即可，实际宽度由内容撑开 */
  .tab-pill span{
    display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;
    transition:max-width .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;
  }
  .tab-pill.active{background:var(--accent,#0a84ff);color:#fff;gap:8px;transform:scale(1.08)}
  .tab-pill.active span{max-width:120px;opacity:1}

  /* 分类列表：横向分页容器，和 banner 轮播同一套做法——
     不依赖原生滚动/scroll-snap，而是用 translateX + transition 直接控制位移，
     手势只负责"跟手拖拽 + 松手判定翻不翻页"，动画节奏完全由自己掌控，不受浏览器滚动惯性影响 */
  /* position:relative + z-index:3：必须比 header-bg（2）高，列表（含里面的
     device-grid/shortcut-row/empty-state）才不会被"非定位内容天生垫底"的规则坑了
     （详见上面 header-bg 的注释），滚动时能稳定盖住常显的 header-bg 底图。
     但不能比 header-fade-bg（4）高，否则列表会画到渐变层上面，从 tab-pill 之间的
     透明缝隙里透出来，把 header-fade-bg 的遮挡效果顶穿（详见上面的注释）。
     同时要比 tab-row（6）低，吸顶后的 BC 行才能继续盖住往上滚的列表内容。 */
  .pager{position:relative;z-index:3;overflow:hidden;touch-action:pan-y}
  /* align-items 必须显式设成 flex-start：默认 stretch 会把矮页面的 .pager-page 实际渲染高度拉到和最高页面一样，
     导致后面 JS 量 scrollHeight 量到的永远是"拉伸后"的高度（等于内容最多的那个 tab），不是该页自己的真实内容高度 */
  .pager-track{display:flex;align-items:flex-start;will-change:transform}
  .pager-page{flex:0 0 100%;min-width:100%}

  /* Favorites 页专属：Shortcuts 横向滚动行，占位用一张截图整体顶替，真素材到了再换成逐项卡片 */
  .shortcut-row{
    /* 上 6px + tab-row 自身 10px 下内边距 = 16px；下 2px + device-grid 自身 14px 上内边距 = 16px */
    padding:6px var(--page-margin) 2px;
    overflow-x:auto;overflow-y:hidden;
    touch-action:pan-x; /* 覆盖父级 .pager 的 pan-y，这一行要能原生横向滚动 */
  }
  .shortcut-row::-webkit-scrollbar{display:none}
  .shortcut-row img{height:64px;display:block}

  /* 底部留白只留一个正常的间距（16px），不再按 .tab-bar 的实测高度整段让出来——
     tab-bar 本身是悬浮在内容上面的（position:absolute，不在文档流里占位），列表本来就该
     滚到最后一张卡片贴近底部为止，最后这段会被 .tab-fade-bg 渐变 + tab-bar 盖住/淡出，
     而不是靠死留白把列表"顶"到 tab-bar 上面去，不然渐变盖住的永远是空白，看不出渐变效果 */
  .device-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px var(--page-margin) 16px;box-sizing:border-box}
  .device-card{background:#fff;border-radius:16px;padding:14px;height:120px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
  .device-card .name{font-size:15px;font-weight:600;color:#1D2529}
  .device-card .loc{font-size:12px;color:#8a8d94}
  .empty-state{text-align:center;padding:60px var(--page-margin) 16px;font-size:13px;color:#8a8d94;box-sizing:border-box}

  /* 设备少时：撑满"BC 吸顶后剩余可视高度"，让内容正好一屏显示，不会多出一截还能继续往下滑；
     设备多时内容自身高度本来就超过这个下限，min-height 不生效，滚动行为不受影响。
     用 100dvh/--screen-h 走纯 CSS 计算而不是 JS 量一次存死，是因为移动端浏览器地址栏收起/展开会实时改变可视高度，
     JS 量的是某一帧的快照，追不上这个变化；CSS calc 自己就会跟着 dvh 实时重算，不用操心时机。
     只给 .pager-page 直接子级的 device-grid 撑满一屏——All Devices 页里嵌在 .room-section 里的
     device-grid 是分组小网格，撑满一屏会把三组撑成三屏空白，不能套这条规则 */
  .pager-page > .device-grid, .empty-state{ min-height:calc(var(--screen-h) - var(--topbar-h) - var(--tabrow-h)); }
  .shortcut-row + .device-grid, .shortcut-row + .empty-state{
    min-height:calc(var(--screen-h) - var(--topbar-h) - var(--tabrow-h) - var(--shortcutrow-h));
  }

  /* All Devices 房间分组：标题行 + 自己的一组 device-grid，多组纵向堆叠 */
  .room-section .device-grid{padding:0 var(--page-margin)}
  .room-section:first-of-type .room-header{padding-top:14px}
  .room-section:last-of-type .device-grid{padding-bottom:16px}
  .room-header{
    display:flex;align-items:center;gap:4px;padding:18px var(--page-margin) 10px;
    font-size:17px;font-weight:600;color:#1D2529;
  }
  .room-header svg{width:14px;height:14px;color:#c2c4ca;transform:rotate(-90deg)}

  .device-card.on{background:#E3EFFC}
  .device-card .card-top{display:flex;align-items:center;justify-content:space-between;position:absolute;top:14px;left:14px;right:14px}
  .device-card .icon{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#b5b8c0}
  .device-card .icon svg{width:22px;height:22px}
  .device-card.on .icon.icon-bulb{color:#FFBF3F}
  .device-card.on .icon.icon-plug{color:#0a84ff}
  .device-card .badge-shared{
    position:absolute;top:-4px;left:-4px;width:16px;height:16px;border-radius:5px;
    background:#1D2529;color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .device-card .badge-shared svg{width:11px;height:11px}
  .device-card .power-btn{
    width:28px;height:28px;border-radius:50%;border:1.5px solid #e3e5ea;background:#fff;
    color:#b5b8c0;display:flex;align-items:center;justify-content:center;
  }
  .device-card .power-btn svg{width:15px;height:15px}
  .device-card .power-btn.on{border-color:#0a84ff;background:#0a84ff;color:#fff}
  .device-card .percent{display:flex;align-items:center;gap:4px;font-size:12px;color:#FF9F0A;margin-top:2px}
  .device-card .percent i{width:6px;height:6px;border-radius:50%;background:#FF9F0A;display:block}
  .device-card .badge-new{
    position:absolute;right:14px;bottom:14px;font-size:10px;font-weight:700;color:#fff;
    background:#FF9F0A;border-radius:6px;padding:2px 6px;line-height:1;
  }

  /* 底部 Tab 页签：胶囊条 + 右侧圆形 Logo 按钮，图标用 assets/bottom tab bar icon 里的真实素材。
     容器本身贴到 .phone 最底部（bottom:0），胶囊条和圆按钮本身不贴边——它们和底部的间距
     是 padding-bottom 留出来的（安全区 + 12px），不是容器没贴底 */
  .tab-bar{
    position:absolute;left:0;right:0;bottom:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:0 20px calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .tab-bar-pill{
    flex:1;display:flex;align-items:stretch;box-sizing:border-box;
    height:64px;background:#fff;border-radius:32px;padding:3px;
    box-shadow:0 8px 24px rgba(20,22,30,.12);
  }
  .tb-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:none;background:none;border-radius:29px;
    font-size:11px;color:#8a8d94;
  }
  /* 选中态图标颜色切换不要用 JS 改 img.src——那是换一张图片资源，首次加载要等解码，
     会有肉眼可见的延迟。两张图标都提前铺在 DOM 里（页面加载时就一起下载解码好了），
     切 active 类只是切 CSS opacity，纯样式计算，没有任何资源加载环节 */
  .tb-icon{position:relative;width:22px;height:22px;display:block}
  .tb-icon img{position:absolute;inset:0;width:22px;height:22px;display:block}
  .tb-icon-on{opacity:0}
  .tb-item.active .tb-icon-on{opacity:1}
  .tb-item.active .tb-icon-off{opacity:0}
  .tb-item.active{background:#E3EFFC;color:#0088E3}
  .tab-bar-logo{
    flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:none;
    background:#fff;box-shadow:0 8px 24px rgba(20,22,30,.12);
    display:flex;align-items:center;justify-content:center;
  }
  .tab-bar-logo img{width:32px;height:32px;display:block}

  /* tab-bar 下面的渐变衬底：列表卡片滚到底部、从胶囊条的圆角缝隙里露出来时，
     不要让卡片硬生生地在缝隙里被截断——用一层和页面底色同色（F5F7FA）的渐变，
     从透明过渡到实色，把卡片"接"到底色上再被胶囊条盖住。参数照 Figma：
     纵向渐变，0% 处 0 透明度，50% 处到 100% 透明度（50%~100% 保持实色）。
     高度跟着 .tab-bar 实测高度走（JS 量，见 syncTabBarHeight），不写死数字。
     z-index 卡在列表内容（.screen 默认层）和 .tab-bar（20）之间，纯装饰，
     不接受点击，不然会挡住它下面露出来的卡片点击区域 */
  .tab-fade-bg{
    position:absolute;left:0;right:0;bottom:0;z-index:15;
    height:calc(var(--tabbar-h, 96px) + 24px);
    background:linear-gradient(to bottom, rgba(245,247,250,0) 0%, #F5F7FA 50%, #F5F7FA 100%);
    pointer-events:none;
  }

  .hint{text-align:center;font-size:12px;color:#a8abb3;max-width:340px}

  @media (max-width:600px){
    .stage{padding:0;height:100dvh}
    .stage-fit{width:100%;height:100%;gap:0;transform:none !important}
    .phone-wrap{width:100%;height:100%;gap:0}
    .hint{display:none}
    /* .phone 的高度本来就该等于 100dvh，但真机"添加到主屏幕"后的独立显示模式下，
       WKWebView 算出来的 100dvh 偶发比真实可视区域偏大，.tab-bar/.tab-fade-bg 原来是
       absolute 贴 .phone 的 bottom:0，跟着 .phone 这个不准的高度走，底部就会空出一截
       页面内容够不到、也不是真机物理边缘的空白。干脆不跟 .phone 的高度较劲——去掉
       .phone 这层 transform 建立的 fixed 定位基准（见上面 .phone 基础规则的注释），让
       .tab-bar/.tab-fade-bg 改成 fixed 之后直接贴真实可视视口的底边，不管 .phone 自己
       量出来的高度准不准，这两个元素的位置都只认真实屏幕底部 */
    .phone{transform:none}
    .tab-bar{position:fixed;padding-bottom:24px}
    .tab-fade-bg{position:fixed}
    .phone{
      width:100%;height:100dvh;border-radius:0;box-shadow:none;background:#f5f7fa;
      --screen-h:100dvh;
      /* 状态栏改成不透明实色条（见 apple-mobile-web-app-status-bar-style）之后，系统会自己
         在状态栏下面留出对应高度，页面内容不再往状态栏底下延伸，env(safe-area-inset-top)
         在真机上会跟着变回 0——基础规则里 max(59px, ...) 那个 59px 是以前给"内容盖住状态栏"
         这种沉浸式场景准备的模拟值，现在不再需要，留着反而会在系统已经让出的空间下面再多出
         一截，这里用一个小一点的呼吸间距盖掉那个 59px */
      --safe-top:calc(env(safe-area-inset-top, 0px) + 12px);
    }
  }

</style>

<script>
  var tabRow = document.getElementById('tabRow');
  var pager = document.getElementById('pager');
  var pagerTrack = document.getElementById('pagerTrack');
  var phoneEl = document.querySelector('.phone');
  var tabBarEl = document.getElementById('tabBar');
  var topBar = document.getElementById('topBar');
  var screenEl = document.getElementById('screen');
  var headerFadeBg = document.getElementById('headerFadeBg');
  var CATS = Array.prototype.map.call(tabRow.querySelectorAll('.tab-pill'), function(b){ return b.dataset.cat; });

  // 桌面预览下手机框的宽高不再写死某个机型的像素值，按当前浏览器窗口能给多少空间现算，
  // 只保留手机常见的宽高比让它看起来还是个"手机"
  var PHONE_ASPECT = 402 / 874;
  function sizePhone(){
    if(window.matchMedia('(max-width:600px)').matches){
      phoneEl.style.width = '';
      phoneEl.style.height = '';
      phoneEl.style.removeProperty('--screen-h');
      return;
    }
    var availH = window.innerHeight - 96;
    var h = Math.max(600, Math.min(900, availH));
    var w = Math.round(h * PHONE_ASPECT);
    phoneEl.style.width = w + 'px';
    phoneEl.style.height = h + 'px';
    phoneEl.style.setProperty('--screen-h', h + 'px');
  }
  sizePhone();

  // device-grid/empty-state 底部要留多少空间才不会被吸底的 .tab-bar 挡住，直接量它的真实渲染高度，
  // 不猜固定值——换真实图标导致 tab-bar 变高变矮时，这里自动跟着对，不用去改别处的数字
  function syncTabBarHeight(){
    phoneEl.style.setProperty('--tabbar-h', tabBarEl.offsetHeight + 'px');
  }
  syncTabBarHeight();

  // 底部 Tab 页签：纯视觉占位，点击只切换高亮态和图标，不做真实页面跳转
  tabBarEl.querySelectorAll('.tb-item').forEach(function(item){
    item.addEventListener('click', function(){
      tabBarEl.querySelectorAll('.tb-item').forEach(function(other){
        other.classList.remove('active');
      });
      item.classList.add('active');
    });
  });

  // 占位设备数据：真实接口数据到了再替换，分类/收藏关系先按这个跑通 tab+pager 联动。
  // room/icon/on/percent/isNew/shared/secondary 这几个字段只给 All Devices 的房间分组视图用，
  // 其余分类 tab 仍然只看 cat/fav，渲染路径不受影响。
  var DEVICES = [
    {cat:'lighting', fav:true, room:'living', icon:'bulb', on:false, secondary:'Location Info'},
    {cat:'lighting', room:'living', icon:'bulb', on:true, percent:100, secondary:'Location Info'},
    {cat:'plugs', room:'living', icon:'plug', on:true, secondary:'Location Info'},
    {cat:'switches', room:'living', icon:'bulb', on:false, secondary:'Location Info'},
    {cat:'plugs', room:'living', icon:'plug', on:true, isNew:true, secondary:'Location Info'},
    {cat:'switches', room:'living', icon:'bulb', on:false, secondary:'Location Info'},
    {cat:'cameras', fav:true, room:'shared', icon:'bulb', on:false, shared:true, secondary:'#Owner Home Name'},
    {cat:'environment', room:'shared', icon:'bulb', on:true, percent:100, shared:true, secondary:'#Owner Home Name'},
    {cat:'plugs', room:'shared', icon:'plug', on:true, shared:true, secondary:'#Owner Home Name'},
    {cat:'groups', room:'shared', icon:'bulb', on:false, shared:true, isNew:true, secondary:'#Owner Home Name'},
    {cat:'others', room:'others', icon:'bulb', on:false, secondary:'Local Only'},
    {cat:'others', room:'others', icon:'bulb', on:true, percent:100, secondary:'Local Only'},
    {cat:'environment', room:'others', icon:'plug', on:true, secondary:'Local Only'},
    {cat:'groups', room:'others', icon:'bulb', on:false, secondary:'Local Only'}
  ];

  var ROOM_SECTIONS = [
    {key:'living', title:'Living Room'},
    {key:'shared', title:'Shared by Others'},
    {key:'others', title:'Others'}
  ];

  var DEVICE_ICON_PATHS = {
    bulb:'M5.4668 6.30469C5.4668 5.46484 5.63281 4.68034 5.96484 3.95117C6.30339 3.22201 6.76888 2.58398 7.36133 2.03711C7.96029 1.48372 8.65365 1.05404 9.44141 0.748047C10.2357 0.442057 11.0885 0.289062 12 0.289062C12.9115 0.289062 13.7643 0.442057 14.5586 0.748047C15.3529 1.05404 16.0462 1.48372 16.6387 2.03711C17.2376 2.58398 17.7031 3.22201 18.0352 3.95117C18.3672 4.68034 18.5332 5.46484 18.5332 6.30469C18.5332 7.0599 18.4486 7.72721 18.2793 8.30664C18.1165 8.87956 17.9049 9.44271 17.6445 9.99609C17.3906 10.5495 17.127 11.1582 16.8535 11.8223C16.5801 12.4863 16.3327 13.2741 16.1113 14.1855C15.8965 15.0905 15.75 16.194 15.6719 17.4961C15.6589 17.6719 15.6003 17.8118 15.4961 17.916C15.3919 18.0202 15.2454 18.0723 15.0566 18.0723H8.94336C8.75456 18.0723 8.60807 18.0202 8.50391 17.916C8.40625 17.8118 8.35091 17.6719 8.33789 17.4961C8.25977 16.194 8.11003 15.0905 7.88867 14.1855C7.67383 13.2741 7.42969 12.4863 7.15625 11.8223C6.88281 11.1582 6.61589 10.5495 6.35547 9.99609C6.10156 9.44271 5.88997 8.87956 5.7207 8.30664C5.55143 7.72721 5.4668 7.0599 5.4668 6.30469ZM8.91406 20.1816C8.7513 20.1816 8.61458 20.1263 8.50391 20.0156C8.39323 19.9049 8.33789 19.7682 8.33789 19.6055C8.33789 19.4492 8.39323 19.3158 8.50391 19.2051C8.61458 19.0944 8.7513 19.0391 8.91406 19.0391H15.0957C15.252 19.0391 15.3854 19.0944 15.4961 19.2051C15.6068 19.3158 15.6621 19.4492 15.6621 19.6055C15.6621 19.7682 15.6068 19.9049 15.4961 20.0156C15.3854 20.1263 15.252 20.1816 15.0957 20.1816H8.91406ZM12 23.0137C11.2383 23.0137 10.5775 22.8411 10.0176 22.4961C9.46419 22.1576 9.17122 21.7083 9.13867 21.1484H14.8711C14.8255 21.7083 14.5228 22.1576 13.9629 22.4961C13.4095 22.8411 12.7552 23.0137 12 23.0137Z',
    plug:'M6.39258 20.2578C5.47266 20.2578 4.78125 20.0293 4.31836 19.5723C3.86133 19.1211 3.63281 18.4414 3.63281 17.5332V6.80176C3.63281 5.89355 3.86133 5.21387 4.31836 4.7627C4.78125 4.30566 5.47266 4.07715 6.39258 4.07715H17.6074C18.5273 4.07715 19.2158 4.30566 19.6729 4.7627C20.1357 5.21387 20.3672 5.89355 20.3672 6.80176V17.5332C20.3672 18.4414 20.1357 19.1211 19.6729 19.5723C19.2158 20.0293 18.5273 20.2578 17.6074 20.2578H6.39258ZM11.6309 11.0908H12.3604C12.5127 11.0908 12.6357 11.0439 12.7295 10.9502C12.8232 10.8564 12.8701 10.7305 12.8701 10.5723V7.92676C12.8701 7.77441 12.8232 7.65137 12.7295 7.55762C12.6357 7.46387 12.5127 7.41699 12.3604 7.41699H11.6309C11.4785 7.41699 11.3555 7.46387 11.2617 7.55762C11.168 7.65137 11.1211 7.77441 11.1211 7.92676V10.5723C11.1211 10.7305 11.168 10.8564 11.2617 10.9502C11.3555 11.0439 11.4785 11.0908 11.6309 11.0908ZM7.64941 16.4346H10.0049C10.1572 16.4346 10.2803 16.3906 10.374 16.3027C10.4678 16.209 10.5146 16.0859 10.5146 15.9336V15.1953C10.5146 15.043 10.4678 14.9199 10.374 14.8262C10.2803 14.7324 10.1572 14.6855 10.0049 14.6855H7.64941C7.49121 14.6855 7.36523 14.7324 7.27148 14.8262C7.18359 14.9199 7.13965 15.043 7.13965 15.1953V15.9336C7.13965 16.0859 7.18359 16.209 7.27148 16.3027C7.36523 16.3906 7.49121 16.4346 7.64941 16.4346ZM13.9951 16.4346H16.3418C16.5059 16.4346 16.6318 16.3906 16.7197 16.3027C16.8135 16.209 16.8604 16.0859 16.8604 15.9336V15.1953C16.8604 15.043 16.8135 14.9199 16.7197 14.8262C16.626 14.7324 16.5 14.6855 16.3418 14.6855H13.9951C13.8428 14.6855 13.7168 14.7324 13.6172 14.8262C13.5234 14.9199 13.4766 15.043 13.4766 15.1953V15.9336C13.4766 16.0859 13.5234 16.209 13.6172 16.3027C13.7168 16.3906 13.8428 16.4346 13.9951 16.4346Z'
  };

  function devicesFor(cat){
    if(cat === 'all') return DEVICES;
    if(cat === 'favorites') return DEVICES.filter(function(d){ return d.fav; });
    return DEVICES.filter(function(d){ return d.cat === cat; });
  }

  // 简单占位卡片：除 All Devices 外的分类 tab 用这个，没有开关/百分比/角标这些信息
  function buildPlainDeviceCard(){
    var card = document.createElement('div');
    card.className = 'device-card';
    card.innerHTML = '<div class="name">Device Name</div><div class="loc">Location Info</div>';
    return card;
  }

  // 带开关状态/百分比/NEW/共享角标的卡片：All Devices 的房间分组视图专用
  function buildRichDeviceCard(d){
    var card = document.createElement('div');
    card.className = 'device-card' + (d.on ? ' on' : '');
    var iconPath = DEVICE_ICON_PATHS[d.icon] || DEVICE_ICON_PATHS.bulb;
    var sharedBadge = d.shared ? '<span class="badge-shared"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.2" fill="currentColor"/><circle cx="17" cy="6" r="2.2" fill="currentColor"/><circle cx="17" cy="18" r="2.2" fill="currentColor"/><path d="M8 11L15 7M8 13L15 17" stroke="currentColor" stroke-width="1.6"/></svg></span>' : '';
    var percentHtml = (d.on && d.percent != null) ? '<div class="percent"><i></i>' + d.percent + '%</div>' : '';
    var newBadge = d.isNew ? '<span class="badge-new">NEW</span>' : '';
    card.innerHTML =
      '<div class="card-top">' +
        '<span class="icon icon-' + d.icon + '"><svg viewBox="0 0 24 24" fill="none"><path d="' + iconPath + '" fill="currentColor"/></svg>' + sharedBadge + '</span>' +
        '<button class="power-btn' + (d.on ? ' on' : '') + '"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5V11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6.5 5.5A8 8 0 1 0 17.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>' +
      '</div>' +
      '<div class="name">Device Name</div>' +
      percentHtml +
      '<div class="loc">' + d.secondary + '</div>' +
      newBadge;
    return card;
  }

  // All Devices 页按 room 分组渲染：每组一个标题行（文字 + 右箭头）+ 自己的 2 列卡片网格
  function buildRoomGroupedPage(list){
    var frag = document.createDocumentFragment();
    ROOM_SECTIONS.forEach(function(section){
      var items = list.filter(function(d){ return d.room === section.key; });
      if(items.length === 0) return;
      var wrap = document.createElement('div');
      wrap.className = 'room-section';
      wrap.innerHTML = '<div class="room-header">' + section.title + '<svg viewBox="0 0 24 24" fill="none"><path d="M12 17.3008C11.6745 17.3008 11.3783 17.1706 11.1113 16.9102L3.67969 9.30273C3.56901 9.19857 3.48438 9.08138 3.42578 8.95117C3.3737 8.81445 3.34766 8.66797 3.34766 8.51172C3.34766 8.29688 3.39648 8.10156 3.49414 7.92578C3.59831 7.75 3.73503 7.61328 3.9043 7.51562C4.07357 7.41146 4.26562 7.35938 4.48047 7.35938C4.79297 7.35938 5.06641 7.47656 5.30078 7.71094L12.4785 15.0645H11.5312L18.6992 7.71094C18.9336 7.47656 19.207 7.35938 19.5195 7.35938C19.7344 7.35938 19.9264 7.41146 20.0957 7.51562C20.265 7.61328 20.3984 7.75 20.4961 7.92578C20.6003 8.10156 20.6523 8.29688 20.6523 8.51172C20.6523 8.81771 20.5417 9.08138 20.3203 9.30273L12.8887 16.9102C12.765 17.0404 12.6283 17.138 12.4785 17.2031C12.3288 17.2682 12.1693 17.3008 12 17.3008Z" fill="currentColor"/></svg></div>';
      var grid = document.createElement('div');
      grid.className = 'device-grid';
      items.forEach(function(d){ grid.appendChild(buildRichDeviceCard(d)); });
      wrap.appendChild(grid);
      frag.appendChild(wrap);
    });
    return frag;
  }

  CATS.forEach(function(cat){
    var page = document.createElement('div');
    page.className = 'pager-page';
    if(cat === 'favorites'){
      var shortcutRow = document.createElement('div');
      shortcutRow.className = 'shortcut-row';
      shortcutRow.innerHTML = '<img src="assets/shortcuts-placeholder@2x.png" alt="">';
      // 嵌在 .pager 里面，横向拖/划这一行时要拦住，别被父级的翻页手势抢走
      shortcutRow.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      shortcutRow.addEventListener('wheel', function(e){ e.stopPropagation(); }, {passive:true});
      page.appendChild(shortcutRow);
    }
    var list = devicesFor(cat);
    if(list.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = '该分类下暂无设备';
      page.appendChild(empty);
    } else if(cat === 'all'){
      page.appendChild(buildRoomGroupedPage(list));
    } else {
      var grid = document.createElement('div');
      grid.className = 'device-grid';
      list.forEach(function(){ grid.appendChild(buildPlainDeviceCard()); });
      page.appendChild(grid);
    }
    pagerTrack.appendChild(page);
  });

  // 设备少的分类页（比如 Favorites 只有 2 个、Switches 只有 1 个）填满一屏这件事交给 CSS 的
  // min-height:calc(var(--screen-h) - ...) 去做（见 .device-grid/.empty-state 规则），不在这量 px 存死——
  // 真机浏览器地址栏收起/展开会实时改变可视高度，JS 量的只是某一帧快照，追不上这个变化，CSS calc 自己会跟着重算。

  // .pager-track 是 flex 容器，默认 align-items:stretch 会把矮页面拉到和最高页面一样高；
  // 用 JS 把 .pager 自身高度显式设成"当前激活页"的内容高度，.pager 的 overflow:hidden 会裁掉
  // pager-track 内部因 stretch 产生的多余高度，这样切到矮页面时滚动范围也会跟着变矮，不再蹭别的分类。
  function syncPagerHeight(){
    var activePage = pagerTrack.children[pagerIdx];
    if(activePage) pager.style.height = activePage.scrollHeight + 'px';
  }

  function setActiveTab(cat){
    var btn = tabRow.querySelector('.tab-pill[data-cat="' + cat + '"]');
    if(!btn || btn.classList.contains('active')) return;
    tabRow.querySelectorAll('.tab-pill').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    // 不能在加 active 的同一帧就量尺寸去滚动：这时候展开动画（span max-width、transform 缩放，
    // 都是 .25s）还没开始播，量到的是展开前的小尺寸，按小尺寸算出的滚动位置，等动画播完变大后
    // 反而会露出一截在屏幕外（之前就是这么漏的）。等展开动画播完再量真实尺寸、再滚动。
    // inline:'nearest' 保证已经完全可见的 tab 不会被多余地居中/移动，只有被裁切的才会动
    setTimeout(function(){
      if(btn.classList.contains('active')) btn.scrollIntoView({behavior:'smooth', inline:'nearest', block:'nearest'});
    }, 260);
  }

  // ---- 分类列表轮播：translateX + transition 直接控制位移，做法和 banner 轮播一致 ----
  // pagerIdx：当前定格的页；拖拽过程中跟手位移，松手后判定翻不翻页；
  // 翻页动画是否在跑，靠自己触发的 transitionend 判断，不依赖浏览器原生滚动/惯性
  var pagerIdx = 0;
  var pagerAnimating = false;
  var stageScale = 1; // 桌面预览下 #stageFit 会整体缩放，拖拽用的是真实鼠标像素，要除以缩放比才能跟手

  function applyTransform(px, withTransition){
    pagerTrack.style.transition = withTransition ? 'transform .32s cubic-bezier(.22,.61,.36,1)' : 'none';
    pagerTrack.style.transform = 'translateX(' + px + 'px)';
  }

  function pagerGoTo(nextIdx, skipTabSync){
    nextIdx = Math.max(0, Math.min(CATS.length - 1, nextIdx));
    pagerIdx = nextIdx;
    pagerAnimating = true;
    applyTransform(-pagerIdx * pager.clientWidth, true);
    syncPagerHeight();
    if(!skipTabSync){
      var cat = CATS[pagerIdx];
      if(cat) setActiveTab(cat);
    }
  }
  pagerTrack.addEventListener('transitionend', function(e){
    if(e.target !== pagerTrack || e.propertyName !== 'transform') return;
    pagerAnimating = false;
  });

  function scrollPagerTo(cat){
    var idx = CATS.indexOf(cat);
    if(idx < 0) return;
    pagerGoTo(idx, true);
  }

  // 点 tab：pager 跟着翻页
  tabRow.addEventListener('click', function(e){
    var btn = e.target.closest('.tab-pill');
    if(!btn) return;
    setActiveTab(btn.dataset.cat);
    scrollPagerTo(btn.dataset.cat);
  });

  window.addEventListener('resize', function(){
    sizePhone();
    if(!pagerAnimating) applyTransform(-pagerIdx * pager.clientWidth, false);
    syncTabBarHeight();
    syncPagerHeight();
    updateFadeLayout();
  });
  // 地址栏收起/展开只改变可视高度，不一定稳定触发 window 的 resize，visualViewport 专门盯这个
  if(window.visualViewport) window.visualViewport.addEventListener('resize', syncPagerHeight);

  // 顶部渐变背景整层的 opacity 跟着滚动走：scrollTop 从 0 滚到"BC 吸顶所需的滚动量"
  // 这段区间内，opacity 从 0 线性过渡到 1，之后保持 1。BC 吸顶所需的滚动量 = BC 在文档流
  // 里的原始 offsetTop 减去它吸顶时的 top 值（等于头像栏高度）——也就是 BC 上面
  // page-title + banner 这些内容的高度，换真实图标/文案导致它们变高变矮时自动跟着对，
  // 不用去猜写死的数字。渐变的高度同理，量"头像栏+BC"的实际渲染高度，正好盖到 BC
  // 底边为止，不多出一截盖到下面的卡片区域。
  var fadeMaxScroll = 0;
  function updateFadeLayout(){
    headerFadeBg.style.height = (topBar.offsetHeight + tabRow.offsetHeight) + 'px';
    fadeMaxScroll = tabRow.offsetTop - topBar.offsetHeight;
    updateFadeOpacity();
  }
  function updateFadeOpacity(){
    var p = fadeMaxScroll > 0 ? Math.min(1, Math.max(0, screenEl.scrollTop / fadeMaxScroll)) : 1;
    headerFadeBg.style.opacity = p;
  }
  updateFadeLayout();
  screenEl.addEventListener('scroll', updateFadeOpacity, {passive:true});

  // 拖拽/触摸：跟手滑动，松手按位移量+速度判定翻不翻页，和常见 banner 轮播一个套路
  var dragging = false, dragStartX = 0, dragStartTime = 0, dragBaseX = 0, dragDeltaX = 0;
  var DRAG_RATIO_THRESHOLD = 0.22; // 滑过 22% 页宽就当作一次有效翻页
  var DRAG_VELOCITY_THRESHOLD = 0.5; // px/ms，快速一甩也算有效翻页

  function dragStart(x){
    if(pagerAnimating) return;
    dragging = true;
    dragStartX = x;
    dragStartTime = Date.now();
    dragBaseX = -pagerIdx * pager.clientWidth;
    dragDeltaX = 0;
  }
  function dragMove(x){
    if(!dragging) return;
    dragDeltaX = (x - dragStartX) / stageScale;
    var atFirst = pagerIdx === 0 && dragDeltaX > 0;
    var atLast = pagerIdx === CATS.length - 1 && dragDeltaX < 0;
    var resisted = (atFirst || atLast) ? dragDeltaX * 0.35 : dragDeltaX; // 到头之后加阻尼，避免空荡荡地拖出一大截
    applyTransform(dragBaseX + resisted, false);
  }
  function dragEnd(){
    if(!dragging) return;
    dragging = false;
    var elapsed = Math.max(1, Date.now() - dragStartTime);
    var velocity = Math.abs(dragDeltaX) / elapsed;
    var ratio = Math.abs(dragDeltaX) / pager.clientWidth;
    var shouldAdvance = ratio > DRAG_RATIO_THRESHOLD || velocity > DRAG_VELOCITY_THRESHOLD;
    if(shouldAdvance && dragDeltaX < 0){
      pagerGoTo(pagerIdx + 1);
    } else if(shouldAdvance && dragDeltaX > 0){
      pagerGoTo(pagerIdx - 1);
    } else {
      pagerGoTo(pagerIdx);
    }
  }

  pager.addEventListener('pointerdown', function(e){
    dragStart(e.clientX);
    pager.setPointerCapture(e.pointerId);
  });
  pager.addEventListener('pointermove', function(e){
    if(!dragging) return;
    e.preventDefault();
    dragMove(e.clientX);
  });
  pager.addEventListener('pointerup', dragEnd);
  pager.addEventListener('pointercancel', dragEnd);

  // 触控板/鼠标滚轮：把一次"划"当成一个完整的手势来看，而不是逐个 wheel 事件响应——
  // 划得越用力，惯性滚动产生的 wheel 事件串就越长，光靠"翻页动画时长"当锁（比如 0.32s）
  // 完全不够用，一次大力的划动惯性能持续超过 1s，动画放完了手势还没完，就会被当成好几次独立的划动，一口气翻好几页。
  // 这里改成：同一串手势里的 deltaX 先累加，事件之间的间隔一旦超过 WHEEL_IDLE_GAP（说明物理上已经停手了，
  // 不只是惯性力度变小），才按累加方向真正翻一页；翻页动画播放期间产生的后续事件直接丢弃，不计入下一次手势。
  var wheelAccumX = 0;
  var wheelIdleTimer = null;
  var WHEEL_IDLE_GAP = 100;
  function wheelBurstEnd(){
    var accum = wheelAccumX;
    wheelAccumX = 0;
    if(pagerAnimating || Math.abs(accum) < 4) return;
    var dir = accum > 0 ? 1 : -1;
    pagerGoTo(pagerIdx + dir);
  }
  pager.addEventListener('wheel', function(e){
    if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    if(pagerAnimating) return;
    wheelAccumX += e.deltaX;
    clearTimeout(wheelIdleTimer);
    wheelIdleTimer = setTimeout(wheelBurstEnd, WHEEL_IDLE_GAP);
  }, {passive:false});

  syncPagerHeight();
  applyTransform(0, false);

  var stageFit = document.getElementById('stageFit');
  function fitStage(){
    if(window.matchMedia('(max-width:600px)').matches){
      stageFit.style.transform = '';
      stageScale = 1;
      return;
    }
    stageFit.style.transform = 'scale(1)';
    var rect = stageFit.getBoundingClientRect();
    var scale = Math.min(1, (window.innerWidth - 32) / rect.width, (window.innerHeight - 32) / rect.height);
    stageFit.style.transform = 'scale(' + scale + ')';
    stageScale = scale;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
